name: Daily Eternal Hero Claim

on:
  schedule:
    # 한국 시간(KST) 오전 9시 10분 = UTC 00:10
    - cron: '10 0 * * *'
  workflow_dispatch:

jobs:
  claim:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 라이브러리 설치
        run: |
          pip install playwright requests
          playwright install chromium

      - name: 자동 수령 실행
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ACCOUNTS: ${{ secrets.ACCOUNTS }}
        run: python bot.py
